<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Patient Registration | DEFLOW AESTHETIC CLINIC</title>

                  "on-secondary-fixed-variant": "#474744",
                  "secondary-fixed": "#e4e2de",

                  "surface-container-high": "#eee7dd",

                  "tertiary": "#5c5c5c",
                  "surface-container": "#f4ede3",
                  "inverse-surface": "#333029",
                  "secondary": "#5e5e5c",
                  "on-primary-fixed": "#311307",
                  "on-surface": "#1e1b15",
                  "on-error": "#ffffff",
                  "secondary-fixed-dim": "#c8c6c3",
                  "on-tertiary-container": "#fffcfb",
                  "surface-dim": "#e0d9cf",
                  "inverse-primary": "#f3baa6",
                  "on-primary-fixed-variant": "#653d2e",
                  "tertiary-container": "#757474",
                  "surface-container-lowest": "#ffffff",

                  "surface-container-low": "#faf3e8",
                  "tertiary-fixed": "#e4e2e1",

                  "on-primary": "#ffffff",
                  "on-primary-container": "#fffbff",
                  "primary-fixed": "#ffdbcf",
                  "background": "#fff8f0",
                  "on-surface-variant": "#514440",
                  "outline-variant": "#d6c2bd",
                  "error-container": "#ffdad6",
                  "inverse-on-surface": "#f7f0e5",
                  "on-secondary-fixed": "#1b1c1a",
                  "on-tertiary-fixed-variant": "#474747",

          },
          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "full": "9999px"
          },
          "spacing": {
                  "gutter": "24px",
                  "section-gap": "48px",
                  "card-padding": "24px",
                  "container-padding": "32px",
                  "unit": "8px"

          "fontFamily": {

      },

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .glass-effect {
      backdrop-filter: blur(12px);
      background-color: rgba(255, 255, 255, 0.85);
    }
    .modal-overlay {
      background-color: rgba(30, 27, 21, 0.4);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #d6c2bd;
      border-radius: 10px;
    }
    .input-focus-gold:focus {
      border-color: #996958;
      box-shadow: 0 0 0 1px #996958;
      outline: none;
    }
  </style>
</head>
<body class="bg-background font-body-md text-on-surface overflow-hidden">
<!-- Blurred Background Context (Dashboard Mockup) -->
<div class="fixed inset-0 z-0 flex flex-col blur-md select-none pointer-events-none">
<!-- TopNavBar -->
<header class="bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm flex justify-between items-center w-full px-gutter h-20">
<div class="flex items-center gap-4">
<span class="font-headline-md text-headline-md font-bold text-secondary tracking-wide">DEFLOW AESTHETIC CLINIC</span>
</div>
<div class="flex items-center gap-6">
<span class="text-on-surface-variant font-body-md">Location: Beverly Hills</span>
<span class="material-symbols-outlined text-secondary">notifications</span>
<span class="material-symbols-outlined text-secondary">settings</span>
</div>
</header>
<div class="flex flex-1 overflow-hidden">
<!-- SideNavBar -->
<aside class="bg-surface-container w-[280px] border-r border-outline-variant/20 flex flex-col p-6 gap-y-4">
<div class="flex flex-col gap-1 mb-8">
<span class="font-headline-md text-headline-md font-semibold text-secondary">DEFLOW</span>
<span class="text-label-md font-label-md text-secondary/60">Aesthetic Excellence</span>
</div>
<nav class="flex flex-col gap-2">
<div class="flex items-center gap-3 p-3 bg-primary-container text-on-primary-container rounded-lg font-semibold">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-md text-label-md">Dashboard</span>
</div>
<div class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-secondary-container/50 rounded-lg">
<span class="material-symbols-outlined">group</span>
<span class="font-label-md text-label-md">Patients</span>
</div>
</nav>
</aside>
<!-- Main Dashboard Area -->
<main class="flex-1 p-gutter bg-surface">
<div class="grid grid-cols-12 gap-6">
<div class="col-span-8 h-64 bg-surface-container-lowest border border-outline-variant rounded-xl"></div>
<div class="col-span-4 h-64 bg-surface-container-lowest border border-outline-variant rounded-xl"></div>
<div class="col-span-12 h-96 bg-surface-container-lowest border border-outline-variant rounded-xl"></div>
</div>
</main>
</div>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-[100] modal-overlay flex items-center justify-center p-4">
<!-- Registration Modal -->
<div class="glass-effect w-full max-w-3xl max-h-[90vh] rounded-xl shadow-2xl flex flex-col overflow-hidden relative">
<!-- Modal Header & Brand Watermark -->
<div class="relative p-8 border-b border-outline-variant/20 overflow-hidden">
<div class="flex justify-between items-start relative z-10">
<div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-1">New Registration</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Create a new patient record for DEFLOW Excellence.</p>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Watermark Image Injection -->
<img alt="DEFLOW Logo Watermark" class="absolute -top-10 -right-10 opacity-5 w-64 rotate-12 pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAECzohahz7m787Ecu4fYbv679BAIqTveZsG6xdK0B3PSXYK-YUOpPjBERktZ0DklnzeGxY16yc7rnvf9M8NLWRxYM2JJfeXAcW0ysxxyQccKxVqowreDk8JB9iiMjw75FthuyPXYPuhPWb_-0NIxqZ_3VFS0XT2o2ebRvlfMs0dwDMUrSuU0WEuFZKY792rFp-7Ww0DY0mdr1uuBhFFEThbkAClR2b6eSV0aGhzcZDPBa86bGntDg"/>
</div>
<!-- Tab Selection -->
<div class="px-8 mt-6">
<div class="flex border-b border-outline-variant/30">
<button class="px-8 py-3 font-label-md text-label-md text-primary font-bold border-b-2 border-primary transition-all pb-3" id="tab-trial" onclick="switchTab('trial')">
            TRIAL PATIENT
          </button>
<button class="px-8 py-3 font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors pb-3" id="tab-regular" onclick="switchTab('regular')">
            REGULAR PATIENT
          </button>
</div>
</div>
<!-- Form Content -->
<div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
<!-- Trial Patient Form -->
<form class="space-y-6" id="form-trial">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Full Name</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md input-focus-gold transition-all" placeholder="John Doe" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Phone Number</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md input-focus-gold transition-all" placeholder="+62 812..." type="tel"/>
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">KTP/ID Number (Indonesia)</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md input-focus-gold transition-all" placeholder="3201..." type="text"/>
</div>
</div>
</form>
<!-- Regular Patient Form (Hidden by default) -->
<form class="hidden space-y-6" id="form-regular">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Full Name</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md input-focus-gold transition-all" placeholder="Jane Smith" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Email Address</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md input-focus-gold transition-all" placeholder="jane@example.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Phone</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md input-focus-gold transition-all" placeholder="+62 821..." type="tel"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Skin Type</label>
<select class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md input-focus-gold transition-all appearance-none">
<option value="dry">Dry</option>
<option value="oily">Oily</option>
<option value="sensitive">Sensitive</option>
<option selected="" value="combination">Combination</option>
</select>
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Medical History</label>
<textarea class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md input-focus-gold transition-all resize-none" placeholder="Disclose any previous surgeries, conditions, or treatments..." rows="3"></textarea>
</div>
<div class="flex flex-col gap-2 md:col-span-2">
<label class="font-body-sm text-body-sm text-on-surface-variant uppercase tracking-wider">Allergy Alert Tags</label>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-2 flex flex-wrap gap-2 items-center min-h-[48px]">
<span class="inline-flex items-center bg-error-container text-on-error-container text-xs px-3 py-1 rounded-full gap-1">
                  Latex <button class="hover:text-error">×</button>
</span>
<span class="inline-flex items-center bg-error-container text-on-error-container text-xs px-3 py-1 rounded-full gap-1">
                  Penicillin <button class="hover:text-error">×</button>
</span>
<input class="border-none focus:ring-0 bg-transparent flex-1 min-w-[100px] text-body-sm p-1" placeholder="Add tag..." type="text"/>
</div>
</div>
</div>
</form>
</div>
<!-- Modal Footer Actions -->
<div class="p-8 border-t border-outline-variant/20 flex justify-end items-center gap-4 bg-surface-container-low/30">
<button class="px-6 py-3 font-label-md text-label-md text-secondary hover:text-primary transition-all">
          CANCEL
        </button>
<button class="bg-primary hover:bg-primary-container text-white px-10 py-3 rounded-lg font-label-md text-label-md tracking-widest shadow-lg shadow-primary/20 transition-all active:scale-95">
          REGISTER PATIENT
        </button>
</div>
</div>
</div>
<script>
    function switchTab(tab) {
      const trialBtn = document.getElementById('tab-trial');
      const regularBtn = document.getElementById('tab-regular');
      const trialForm = document.getElementById('form-trial');
      const regularForm = document.getElementById('form-regular');

      if (tab === 'trial') {
        trialBtn.classList.add('text-primary', 'font-bold', 'border-b-2', 'border-primary');
        trialBtn.classList.remove('text-on-surface-variant');
        regularBtn.classList.remove('text-primary', 'font-bold', 'border-b-2', 'border-primary');
        regularBtn.classList.add('text-on-surface-variant');
        trialForm.classList.remove('hidden');
        regularForm.classList.add('hidden');
      } else {
        regularBtn.classList.add('text-primary', 'font-bold', 'border-b-2', 'border-primary');
        regularBtn.classList.remove('text-on-surface-variant');
        trialBtn.classList.remove('text-primary', 'font-bold', 'border-b-2', 'border-primary');
        trialBtn.classList.add('text-on-surface-variant');
        regularForm.classList.remove('hidden');
        trialForm.classList.add('hidden');
      }
    }
  </script>
</body></html>
